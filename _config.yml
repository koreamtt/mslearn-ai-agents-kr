  # was copying ~199 files from here into _site for no benefit, and processing
  # content it was never meant to render.
  - Labfiles/
  - tools/
header_pages:
  - index.html
author: Microsoft Learning
twitter_username: mslearning
github_username: koreamtt
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jemoji
markdown: kramdown
kramdown:
   syntax_highlighter_opts:
      disable : true
title: Azure에서 AI 에이전트 개발
