remote_theme: MicrosoftLearning/Jekyll-Theme
url: https://koreamtt.github.io
baseurl: /mslearn-ai-agents-kr
repository: koreamtt/mslearn-ai-agents-kr
lang: ko
exclude:
  - readme.md
  - .github/
  - Instructions-kr/README.md
